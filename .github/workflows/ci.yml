name: Tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Setup, hosting and release regression tests
        run: python -B -m unittest discover -s tests -v
      - name: AI boundary and transport regression tests
        run: python -B -m unittest discover -s ai/tests -v
      - name: Validate chat configuration
        run: python -B ai/bridge.py --check
      - name: Audit distributable source and Bash syntax
        shell: bash
        run: |
          python -B tools/build_release.py
          python -B - <<'PY'
          import subprocess
          from tools.build_release import public_files
          for source in public_files():
              if source.suffix == '.sh':
                  subprocess.run(['bash', '-n', str(source)], check=True)
          PY

  windows:
    name: Windows PowerShell client checks
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse scripts and test synthetic client setup
        shell: powershell
        run: '& ./tests/test_windows_client.ps1'

  package:
    name: Build audited dev preview
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build source ZIP and verify checksum
        shell: bash
        run: |
          version="$(python -B tools/build_release.py --version)"
          python -B tools/build_release.py --output "dist/outlands-bo2-mod-v${version}-dev-preview.zip"
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outlands-bo2-mod-dev-preview
          path: |
            dist/outlands-bo2-mod-v*-dev-preview.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
