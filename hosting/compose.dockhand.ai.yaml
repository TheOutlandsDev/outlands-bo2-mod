# Images are built locally first; this stack contains no host source mounts.
name: outlands-t6
services:
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.2}
    hostname: ${TS_HOSTNAME:-outlands-t6}
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-outlands-t6}
      TS_USERSPACE: 'false'
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: 'true'
      TS_BOOT_TIMEOUT: 10m
      TS_ENABLE_HEALTH_CHECK: 'true'
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    devices:
    - /dev/net/tun:/dev/net/tun
    cap_add:
    - NET_ADMIN
    - NET_RAW
    volumes:
    - tailscale-state:/var/lib/tailscale
    networks:
    - tailnet-egress
    - ai-private
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9002/healthz
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10m
    restart: unless-stopped
  t6:
    image: outlands-t6:local
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true
    environment:
      T6_MODE: ${T6_MODE:-lan}
      T6_BIND_IP: ${T6_BIND_IP:-0.0.0.0}
      T6_PORT: ${T6_PORT:-4977}
      T6_NAME: ${T6_NAME:-Outlands BO2}
      T6_CHAT_ENABLED: '1'
      T6_CAREERS_ENABLED: '1'
      T6_OPERATIONS_ENABLED: '1'
      T6_SERVER_KEY_FILE: /data/private/plutonium_server_key
    volumes:
    - t6-state:/data
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
  ollama:
    image: outlands-bo2-ollama:local
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
    - ollama-models:/root/.ollama
    networks:
    - ai-private
    - model-download
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 4
    mem_limit: 3g
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  chat:
    image: outlands-bo2-chat:local
    network_mode: service:tailscale
    depends_on:
      t6:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      T6_CHAT_ENABLED: '1'
      T6_CAREERS_ENABLED: '1'
      T6_OPERATIONS_ENABLED: '1'
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: outlands-bo2-chat
      T6_CHAT_RCON_PORT: ${T6_PORT:-4977}
    volumes:
    - t6-state:/data:ro
    - rival-state:/rivals
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 0.5
    mem_limit: 128m
    restart: unless-stopped
networks:
  tailnet-egress:
    driver: bridge
  ai-private:
    internal: true
  model-download:
    driver: bridge
volumes:
  tailscale-state: null
  t6-state: null
  ollama-models: null
  rival-state: null
