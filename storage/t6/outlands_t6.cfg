// The Outlands BO2 Mod. Native bots and normal earned player progression.
// Copy into the active Plutonium storage/t6 directory on the host.

sv_hostname "The Outlands BO2 Mod | Native AI"
g_password "REPLACE_WITH_A_PRIVATE_JOIN_PASSWORD"
sv_maxclients 16
sv_replaceBots 1
sv_voice 1

// RCON is unused. Set up host access through Tailscale separately.
rcon_password ""
demo_enabled 0

// One Outlands controller owns native bot filling after a human joins.
// Disable stock automatic filling to avoid competing population managers.
bot_friends 0
bot_enemies 0
bot_difficulty 2
// Native roster names in random order, with blank clan-tag fields in bots.txt.
// Every bot retains its native test-client identity.
set sv_randomizeBotNames 1
bot_UseFriendNames 0
party_autoteams 1
set sv_botsoak 0

// Target is total humans plus native test clients, capped by sv_maxclients.
set outlands_native_bots 1
set outlands_bot_fill 16
// 0 easy, 1 normal, 2 hard, 3 veteran. Player stats are not changed.
set outlands_bot_difficulty 2

// Cosmetic bot levels only, rerolled when a bot joins. Range is inclusive 1-55.
// No human rank/XP, bot unlock eligibility, prestige or persistent stats change.
set outlands_bot_levels 1
set outlands_bot_level_min 1
set outlands_bot_level_max 55

// Weapons/loadouts use the stock bot generator: valid random unlocked classes,
// attachments, perks and equipment; native class choice varies between lives.
// Human Create-a-Class and unlocks remain the normal game progression system.

// Optional local Ollama chat bridge. Hosting enables it explicitly.
// The bridge observes public chat and sends bounded native bot chat only.
set outlands_chat_enabled 0
set outlands_chat_cooldown 20
set outlands_chat_interval 60
set outlands_chat_timeout 45
set outlands_chat_response ""

// Allow time for LAN clients to finish loading and choose a class.
set scr_kick_time 600

// Show current rank XP for the progression smoke test. No stats are edited.
set outlands_status 1

// All 15 multiplayer maps installed on the development host: 14 base maps
// plus Nuketown 2025. Clients need the selected map's owned game files.
// Eight modes with native objective/combat support; each CFG resets defaults.
sv_maprotation "gametype dom execgts outlands_dom.cfg map mp_raid gametype conf execgts outlands_conf.cfg map mp_slums gametype tdm execgts outlands_tdm.cfg map mp_hijacked gametype koth execgts outlands_koth.cfg map mp_nuketown_2020 gametype ctf execgts outlands_ctf.cfg map mp_express gametype hq execgts outlands_hq.cfg map mp_village gametype dem execgts outlands_dem.cfg map mp_dockside gametype dm execgts outlands_dm.cfg map mp_socotra gametype tdm execgts outlands_tdm.cfg map mp_la gametype dom execgts outlands_dom.cfg map mp_carrier gametype conf execgts outlands_conf.cfg map mp_drone gametype hq execgts outlands_hq.cfg map mp_meltdown gametype koth execgts outlands_koth.cfg map mp_overflow gametype ctf execgts outlands_ctf.cfg map mp_nightclub gametype dem execgts outlands_dem.cfg map mp_turbine"
