// OPTIONAL: exec outlands_ui_keys.cfg from your own game console.
// This replaces F6-F9 bindings. Record your existing bindings before opting in.
// The host must enable outlands_ui. This does not pause a multiplayer match.
bind F6 "say /!outlands"
bind F7 "say /!outlands next"
bind F8 "say /!outlands focus"
bind F9 "say /!outlands close"
